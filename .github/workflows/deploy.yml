name: Deploy MacroMonitor

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.1'

      - name: Verify initial release baseline
        run: |
          if ! git show-ref --verify --quiet refs/tags/v1.0.0; then
            echo "::error::Missing v1.0.0 baseline tag. Follow docs/releases.md before activating releases."
            exit 1
          fi
          if ! git merge-base --is-ancestor refs/tags/v1.0.0 HEAD; then
            echo "::error::The v1.0.0 baseline tag must point to an ancestor of this main commit."
            exit 1
          fi

      - run: npm ci

      - name: Install backend dependencies for tests and release hooks
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        run: npm test

      - name: Run semantic-release
        run: npx --no-install semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'

      # --- Frontend ---
      - name: Create frontend .env.production
        run: |
          cat <<EOF > .env.production
          VITE_CLOUDINARY_URL=https://res.cloudinary.com/dzgj2ovq2/image/upload/
          VITE_API_URL=/api
          VITE_USDA_API_KEY=${{ secrets.VITE_USDA_API_KEY }}
          EOF

      - name: Install & build frontend
        run: |
          npm ci
          npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 3

      # --- Backend ---
      - name: Install & build backend
        working-directory: backend
        run: |
          npm ci
          npm run build

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: |
            backend/dist/
            backend/package.json
            backend/package-lock.json
          retention-days: 3

  deploy:
    needs: build
    runs-on: [self-hosted, hetzner]   # Label(s) beim Runner-Setup vergeben
    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: /tmp/deploy-macromonitor/frontend

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: /tmp/deploy-macromonitor/backend

      - name: Deploy frontend
        run: |
          set -e
          rm -rf /var/www/app/macroMonitor/dist
          cp -r /tmp/deploy-macromonitor/frontend /var/www/app/macroMonitor/dist

      - name: Deploy backend
        run: |
          set -e
          rm -rf /var/www/app/macroMonitor/backend/dist
          cp -r /tmp/deploy-macromonitor/backend/dist /var/www/app/macroMonitor/backend/dist
          cp /tmp/deploy-macromonitor/backend/package.json /var/www/app/macroMonitor/backend/package.json
          cp /tmp/deploy-macromonitor/backend/package-lock.json /var/www/app/macroMonitor/backend/package-lock.json

      - name: Install backend production dependencies
        working-directory: /var/www/app/macroMonitor/backend
        run: npm ci --omit=dev

      - name: Restart app with pm2
        run: pm2 restart macromonitor

      - name: Clean up temp files
        if: always()
        run: rm -rf /tmp/deploy-macromonitor
